<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفلام رومانسية كاملة على يوتيوب 2026 ❤️🌹</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>مكتبة أفلام رومانسية كاملة</h1>
        <p>إنجليزي ومصري - قصص حب هتخليك تحلم ❤️</p>

        <!-- شهادة أمان + عداد زوار -->
        <div class="security-badge">
            <span>🔒 الموقع آمن ومشفر</span> | 
            <span id="visitorCount">عدد الزوار: تحميل...</span>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-button active" data-tab="english">رومانسي إنجليزي ❤️</button>
        <button class="tab-button" data-tab="egyptian">رومانسي مصري 🇪🇬❤️</button>
    </div>

    <div class="search-box">
        <input type="text" id="globalSearch" placeholder="ابحث عن فيلم رومانسي...">
    </div>

    <div class="container" id="moviesContainer"></div>

    <footer>
        <p>كل الأفلام كاملة مجاناً على يوتيوب - استمتع بالحب يا قمر ❤️</p>
    </footer>

    <script src="js1.js"></script>
    <script src="js2.js"></script>
    <script src="main.js"></script>

    <!-- عداد زوار بسيط باستخدام localStorage (يعمل بدون سيرفر) -->
    <script>
        let visitors = localStorage.getItem('visitorCount') || 0;
        visitors++;
        localStorage.setItem('visitorCount', visitors);
        document.getElementById('visitorCount').textContent = `عدد الزوار: ${visitors.toLocaleString()}`;
    </script>
</body>
    </html>
